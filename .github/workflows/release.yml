name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  WIX_VERSION: '5.0.2'

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: state
        run: |
          printf 'a hosted runner, %s logical CPUs, %s %s, on mains\n' \
            "$(getconf _NPROCESSORS_ONLN)" "$RUNNER_OS" "$RUNNER_ARCH"
          go version
          dotnet --version
          git rev-parse HEAD
          test -f installer/payload.tsv || {
            printf 'FAIL  installer/ is not in this repository. It is generated from the\n'
            printf '      private tree by scripts/split.sh and nothing here can build a\n'
            printf '      package without it.\n'
            exit 1
          }

      - name: sources
        run: |
          rows() { grep -v '^>' "$1" | sed '/^[[:space:]]*$/d' | tail -n +2 | tr -s '\t'; }
          mkdir -p src
          while IFS=$'\t' read -r id repo ref; do
            [ "$repo" = '-' ] && continue
            git init -q "src/$id"
            git -C "src/$id" remote add origin "https://github.com/$repo"
            git -C "src/$id" fetch -q --depth 1 origin "$ref"
            git -C "src/$id" checkout -q FETCH_HEAD
            got=$(git -C "src/$id" rev-parse HEAD)
            if [ "$got" != "$ref" ]; then
              printf 'FAIL  %s is at %s, pinned to %s\n' "$id" "$got" "$ref"
              exit 1
            fi
            printf 'ok    %s %s at %s\n' "$id" "$repo" "$ref"
          done < <(rows installer/sources.tsv)

      - name: build
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOFLAGS: -trimpath
        run: |
          rows() { grep -v '^>' "$1" | sed '/^[[:space:]]*$/d' | tail -n +2 | tr -s '\t'; }
          root=$PWD
          for arch in amd64 arm64; do
            while IFS=$'\t' read -r feature path kind source from sign; do
              [ "$kind" = gobuild ] || continue
              [ "$source" = UNRESOLVED ] && continue
              if [ "$source" = self ]; then dir="$root/$from"; else dir="$root/src/$source/$from"; fi
              for pass in a b; do
                mkdir -p "$root/$pass/$arch"
                (cd "$dir" && GOARCH="$arch" go build -ldflags '-s -w -buildid=' \
                   -o "$root/$pass/$arch/$path" .)
              done
              printf 'built %s %s\n' "$arch" "$path"
            done < <(rows installer/payload.tsv)
          done

      - name: reproducible
        run: |
          rc=0
          for f in a/*/*; do
            if cmp -s "$f" "b/${f#a/}"; then
              printf 'ok    %s is byte-identical across two builds of one commit\n' "${f#a/}"
            else
              printf 'FAIL  %s differs between two builds of one commit\n' "${f#a/}"
              rc=1
            fi
          done
          n=$(find a -type f | wc -l)
          if [ "$n" -lt 2 ]; then
            printf 'FAIL  binaries — %s inputs, and this rule cannot fail on fewer than 2\n' "$n"
            exit 1
          fi
          exit $rc

      - name: wix
        run: |
          dotnet tool install --global wix --version "$WIX_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: package
        run: |
          rows() { grep -v '^>' "$1" | sed '/^[[:space:]]*$/d' | tail -n +2 | tr -s '\t'; }
          gate() { rows installer/payload.tsv | awk -F'\t' -v p="$1" '$2==p {print ($4=="UNRESOLVED")?"no":"yes"}'; }
          root=$PWD
          ref=${GITHUB_REF_NAME#v}
          case "$ref" in [0-9]*.[0-9]*.[0-9]*) version=$ref ;; *) version=0.0.0 ;; esac
          panel=$(gate 'Abstraction Panel.exe')
          cpp=$(gate 'dev/include/abstraction/download/over_curl.hpp')
          printf 'version %s   panel %s   c++ headers %s\n' "$version" "$panel" "$cpp"

          wix extension add -g "WixToolset.UI.wixext/$WIX_VERSION"
          python3 installer/mklicense.py LICENSE license.rtf
          python3 installer/validate.py

          mkdir -p dist
          for arch in x64 arm64; do
            case $arch in x64) goarch=amd64 ;; *) goarch=arm64 ;; esac
            rm -rf payload
            while IFS=$'\t' read -r feature path kind source from sign; do
              [ "$source" = UNRESOLVED ] && continue
              mkdir -p "payload/$(dirname "$path")"
              case "$kind" in
                gobuild)  cp "a/$goarch/$path" "payload/$path" ;;
                authored) cp "installer/$from" "payload/$path" ;;
                copy)     cp "src/$source/$from" "payload/$path" ;;
              esac
            done < <(rows installer/payload.tsv)

            for pass in a b; do
              wix build -arch "$arch" -bindpath "$root" \
                -d Version="$version" -d Panel="$panel" -d Cpp="$cpp" \
                -ext WixToolset.UI.wixext \
                -o "$pass/abstraction-$arch.msi" installer/abstraction.wxs
            done
            cp "a/abstraction-$arch.msi" "dist/abstraction-$arch.msi"
            if cmp -s "a/abstraction-$arch.msi" "b/abstraction-$arch.msi"; then
              printf 'ok    abstraction-%s.msi is byte-identical across two builds\n' "$arch"
            else
              printf 'note  abstraction-%s.msi differs between two builds; its inputs do not\n' "$arch"
            fi
          done

      - name: digests
        run: |
          n=$(ls dist/*.msi | wc -l)
          if [ "$n" -lt 2 ]; then
            printf 'FAIL  packages — %s inputs, and this rule cannot fail on fewer than 2\n' "$n"
            exit 1
          fi
          (cd dist && sha256sum ./*.msi | sed 's#\./##' | tee SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: abstraction-windows-unsigned
          path: dist/
          if-no-files-found: error

      - name: unsigned
        if: always()
        run: |
          {
            printf '\n### Unsigned\n\n'
            printf 'These packages are **not signed**. Windows SmartScreen will warn, and our own\n'
            printf 'strict mode refuses an unsigned service. Signing is a separate, manually\n'
            printf 'approved step outside this workflow, and it signs the four programs inside\n'
            printf 'each MSI as well as the MSI itself — see installer/signpath.artifact-configuration.xml.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: package
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: fetch the package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" -n abstraction-windows-unsigned -D pkg

      - name: install
        shell: pwsh
        run: |
          $msi = (Resolve-Path pkg\abstraction-x64.msi).Path
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList @('/i', $msi, '/qn', '/norestart', '/l*v', 'install.log')
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "msiexec /i exited $($p.ExitCode)" }

      - name: what it changed
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Abstraction'
          foreach ($f in 'jobd.exe','dl.exe','jobctl.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f was not installed" }
          }
          $path = (Get-ItemProperty 'HKCU:\Environment' -Name Path -ErrorAction Stop).Path
          if ($path -notlike "*$dir*") { throw "PATH does not carry $dir" }
          foreach ($t in 'jobd','jobd-logon') {
            schtasks /query /tn $t | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "scheduled task $t was not registered" }
          }
          if (-not (Get-ItemProperty 'HKCU:\Software\OpenAbstractions\Abstraction' -ErrorAction SilentlyContinue)) {
            throw 'the registry marker was not written'
          }
          'ok    files, PATH, two scheduled tasks, one registry key'

      # The store is redirected so the five-minute sweep task cannot touch this
      # job: what is being measured is dl moving the bytes itself, with no
      # supervisor of any kind on the machine.
      - name: the tools without a supervisor
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Abstraction'
          $work = Join-Path $env:RUNNER_TEMP 'nosupervisor'
          New-Item -ItemType Directory -Force -Path "$work\serve","$work\out","$work\store" | Out-Null
          $env:ABSTRACTION_STORE = "$work\store"
          Set-Content "$work\serve\thing.bin" 'the tools must work with the service feature unticked'
          $srv = Start-Process python -PassThru -WorkingDirectory "$work\serve" -ArgumentList '-m','http.server','8099','--bind','127.0.0.1'
          try {
            for ($i = 0; $i -lt 50; $i++) {
              try { Invoke-WebRequest 'http://127.0.0.1:8099/thing.bin' -UseBasicParsing | Out-Null; break }
              catch { Start-Sleep -Milliseconds 200 }
            }
            $fetched = & "$dir\dl.exe" 'http://127.0.0.1:8099/thing.bin' -o "$work\out" 2>&1
            $fetched
            if ($LASTEXITCODE -ne 0) { throw "dl exited $LASTEXITCODE with nothing supervising" }
            if (-not (Test-Path "$work\out\thing.bin")) { throw 'dl reported success and delivered nothing' }
            $named = $fetched | Select-String -Pattern '^\s*job\s+(\S+)'
            if (-not $named) { throw 'dl did not name the job it created' }
            $id = $named.Matches[0].Groups[1].Value

            $listed = & "$dir\jobctl.exe" list
            $listed
            if ($LASTEXITCODE -ne 0) { throw "jobctl exited $LASTEXITCODE with nothing supervising" }
            # Exit 0 is not the property. Two tools out of one installer have to
            # be looking at ONE store, and only the record dl just wrote says so.
            if (-not ($listed | Select-String -SimpleMatch $id)) {
              throw "jobctl read a store with no $id in it: the two tools in this package disagree about where the store is"
            }
          } finally {
            Stop-Process -Id $srv.Id -Force
          }
          'ok    dl delivered the bytes and jobctl read back the same job, with no jobd running'

      # The shell a person actually has after running the MSI: nothing set, both
      # tools obliged to find the store the machine already has. This is the case
      # the first install ever performed died on, and the case no test had, because
      # every harness in the tree exports the answer before it starts.
      - name: the tools with nothing set
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Abstraction'
          Remove-Item Env:ABSTRACTION_STORE, Env:JOB_STORE, Env:MODELGET_STORE -ErrorAction SilentlyContinue
          & "$dir\jobctl.exe" list
          if ($LASTEXITCODE -ne 0) { throw "jobctl exited $LASTEXITCODE with nothing set" }
          & "$dir\dl.exe" tiers
          if ($LASTEXITCODE -ne 0) { throw "dl tiers exited $LASTEXITCODE with nothing set" }
          $store = Join-Path $env:USERPROFILE '.abstraction'
          if (-not (Test-Path $store)) { throw "neither tool resolved $store" }
          'ok    both tools found the store this machine already has, with nothing set'

      - name: uninstall
        shell: pwsh
        run: |
          $msi = (Resolve-Path pkg\abstraction-x64.msi).Path
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList @('/x', $msi, '/qn', '/norestart', '/l*v', 'uninstall.log')
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 60; throw "msiexec /x exited $($p.ExitCode)" }

      - name: what it left behind
        shell: pwsh
        run: |
          $bad = @()
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Abstraction'
          if (Test-Path $dir) { $bad += "the install folder survived: $((Get-ChildItem -Recurse $dir).Count) files" }
          $path = (Get-ItemProperty 'HKCU:\Environment' -Name Path -ErrorAction SilentlyContinue).Path
          if ($path -like "*$dir*") { $bad += 'PATH still carries the install folder' }
          foreach ($t in 'jobd','jobd-logon') {
            schtasks /query /tn $t 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { $bad += "scheduled task $t is still registered" }
          }
          if (Get-Item 'HKCU:\Software\OpenAbstractions' -ErrorAction SilentlyContinue) { $bad += 'the registry key survived' }
          $arp = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
                 ForEach-Object { $_.GetValue('DisplayName') } | Where-Object { $_ -eq 'Abstraction' }
          if ($arp) { $bad += 'it is still listed in Apps & features' }
          if ($bad) { $bad | ForEach-Object { "FAIL  $_" }; throw 'uninstall did not reverse everything' }
          'ok    nothing left: no files, no PATH entry, no tasks, no registry key, no ARP entry'
